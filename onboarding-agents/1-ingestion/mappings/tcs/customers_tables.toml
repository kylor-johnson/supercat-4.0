# Country names -> ISO-3166 alpha-2.
#
# Two values in the whole source. Written as a TABLE rather than a transform
# because the next country the client adds must fail loudly here, not be
# guessed at by a title-casing rule.
[country_iso]
"United States" = "US"
"USA" = "US"
"Canada" = "CA"


# Full state / province name -> the two-character code eCat validates.
#
# The source spells states out (`Florida`); the live file is `FL`. Blind I
# preserved the full name on the grounds that abbreviating is a transform
# nobody asked for -- and lost 720 of 721 rows on BillToState and another 720
# on ShipToState, 62% of every differing cell in the file.
#
# The reasoning was not wrong in general; it was wrong HERE, because eCat
# validates state against a two-character code when country validation is on,
# and `Florida` is not a code. A class-3 rule about not editing the client's
# text does not survive contact with a field the importer validates.
#
# A table, not a library function, so an unseen province fails loudly.
[state_code]
"Alabama" = "AL"
"Arizona" = "AZ"
"Arkansas" = "AR"
"California" = "CA"
"Colorado" = "CO"
"Connecticut" = "CT"
