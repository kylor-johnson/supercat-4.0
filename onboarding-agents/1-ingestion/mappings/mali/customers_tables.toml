# Source price level -> the org's live price level code.
#
# `list` in the export, `dn` (dealer net) live. Which level a customer sits on
# is the ORG's decision, not the export's, and DefaultPriceCode must match an
# Admin price level code exactly or every row is rejected.
#
# A table, not a suffix rule, so a fourth code fails loudly.
[price_code]
"mllist"  = "mldn"
"nsllist" = "nsldn"
