:root {
  --black: #0f0f0f;
  --white: #fafaf8;
  --cream: #f5f3ee;
  --green-dark: #1a2e1f;
  --green-mid: #2d4a35;
  --green-light: #4a7c59;
  --gold: #c9a84c;
  --gray-400: #9e9b94;
  --gray-600: #6b6860;
  --gray-800: #3a3834;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--cream);
  color: var(--gray-800);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

.wrap {
  max-width: 560px;
  margin: 0 auto;
  padding: 48px 24px 80px;
}

header {
  margin-bottom: 36px;
}

.eyebrow {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--gold);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 10px;
}

h1 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: clamp(32px, 8vw, 44px);
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--green-dark);
  line-height: 1.1;
}

.sub {
  margin-top: 12px;
  color: var(--gray-600);
  font-size: 14px;
}

nav ul {
  list-style: none;
}

nav li {
  border-bottom: 1px solid rgba(26, 46, 31, 0.12);
}

nav li:first-child {
  border-top: 1px solid rgba(26, 46, 31, 0.12);
}

nav a {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  padding: 18px 4px;
  color: var(--green-dark);
  text-decoration: none;
  font-weight: 500;
  transition: color 0.15s ease, background 0.15s ease;
  border-radius: 6px;
  margin: 2px -8px;
  padding-left: 8px;
  padding-right: 8px;
}

nav a:hover,
nav a:focus-visible {
  color: var(--green-mid);
  background: rgba(74, 124, 89, 0.08);
  outline: none;
}

.num {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--gray-400);
  flex-shrink: 0;
}

</style>
