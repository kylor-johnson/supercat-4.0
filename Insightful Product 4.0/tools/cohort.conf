# Insightful 4.0 — verification cohort (org <TAB> cache-date)
#
# Dates are PINNED, never auto-resolved. Two reasons:
#   1. run.sh defaults --date to TODAY and then calls populate_cache, which
#      needs VPN + Postgres. Pinning keeps the whole harness offline.
#   2. Cache completeness varies per date (16 CSVs = gather only; 20-24 =
#      includes the platform floor). Auto-picking "most CSVs" would silently
#      change which queries feed a report between runs.
#
# Each date below is the one that produced the currently-tracked output in
# outputs/, so the baseline is comparable to what has actually shipped.
# Golden-set orgs (sarreid, cci, da, clc) use their golden_set.json dates.
#
# EXCLUDED: bcf — no ratified profile AND empty cache dir (0 csv / 0 sql).

