# The CopperSmith (tcs) -- the MERGE STEP, demonstrated.
#
# `_INTERMEDIATE_option_assignments.csv` is NOT an eCat import file. There is no
# importer slot for a product-to-group table: a product references a group
# through `OptionSet1..20` INSIDE products.csv. So the option stack's third
# artifact has to be merged into products.csv before upload, and this file is
# that merge expressed as a mapping rather than asserted in a comment.
#
# It is deliberately MINIMAL -- the key plus the OptionSet columns -- because
# its job is to prove the join resolves, not to re-state products.toml. A
# production `products.toml` declares these same `op = "source"` fields inline
# alongside its other 60, and then ONE file goes to the FTP.
#
# Run order: options_v2.toml first (it writes the intermediate), then this.

client        = "tcs"
org_name      = "The CopperSmith"
target        = "products.csv"
input_class   = 3
dialect       = "tcs"
line_terminator = "crlf"
primary_input = "lanterns"

[inputs.lanterns]
format   = "csv_multi_named"
encoding = "utf-8-sig"
files = [
  { path = "Source Data/Master Sheet E+G-Table 1.csv", header_row = 2 },
  { path = "Source Data/Weiyan LED-Table 1.csv", header_row = 2 },
]

# The intermediate, keyed on the product code. An absolute path is passed on the
# command line in practice; this relative one resolves against the client root.
[inputs.optionsets]
format   = "csv"
encoding = "utf-8-sig"
path     = "_INTERMEDIATE_option_assignments.csv"
key      = "SKU"

[[derived]]
name = "_sku"
op = "column"
column = "SKU"
primitive = "trim"

[[fields]]
name = "BaseItemCode"
op = "ref"
from = "_sku"

[[fields]]
name = "OptionSet1"
op = "source"
input = "optionsets"
key = "_sku"
field = "OptionSet1"
[[fields]]
name = "OptionSet1Required"
op = "source"
input = "optionsets"
key = "_sku"
field = "OptionSet1Required"
[[fields]]
name = "OptionSet2"
op = "source"
input = "optionsets"
key = "_sku"
field = "OptionSet2"
[[fields]]
name = "OptionSet3"
op = "source"
input = "optionsets"
key = "_sku"
field = "OptionSet3"
[[fields]]
name = "OptionSet4"
op = "source"
input = "optionsets"
key = "_sku"
field = "OptionSet4"
[[fields]]
name = "OptionSet5"
op = "source"
input = "optionsets"
key = "_sku"
field = "OptionSet5"
[[fields]]
name = "OptionSet6"
op = "source"
input = "optionsets"
key = "_sku"
field = "OptionSet6"
[[fields]]
name = "OptionSet7"
op = "source"
input = "optionsets"
key = "_sku"
field = "OptionSet7"
[[fields]]
name = "OptionSet8"
op = "source"
input = "optionsets"
key = "_sku"
field = "OptionSet8"
