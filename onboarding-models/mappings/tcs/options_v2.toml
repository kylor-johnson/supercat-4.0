# The CopperSmith (tcs) -- the OPTION STACK, v2. POST-UNBLIND.
#
# `options.toml` is the BLIND mapping and stays exactly as it was written; its
# score is the score. This file is the correction, and the correction is not a
# tweak -- it is a different reading of what the source is.
#
# ============================================================================
# WHAT THE BLIND RUN MISSED, AND IT WAS IN THE FOLDER THE WHOLE TIME
# ============================================================================
#
# Blind, I read the 72 transposed columns as the WHOLE option stack: header =
# option name, cell = option code, and the eight-way type partition invented by
# me from the column names, with a paragraph of the mapping spent justifying it.
#
# 338 of the 341 options in the build are rows of `Accessories-Table 1.csv`.
#
#   Accessory SKU       -> options.Code          338 of 341
#   Accessory Name      -> options.Name          303 of 341 byte-exact
#   Accessory Dealer Net-> options.PriceAddend   338 of 341
#   Accessory Category  -> options.Description   = THE TYPE PARTITION
#
# `Accessory Category` holds GAS, ELECTRIC, FINISHES, DECORATIVE OPTIONS, WALL
# ACCESSORIES, CEILING MOUNT, WALL MOUNT, POST & PIER MOUNT -- eight option
# types, which is the partition I spent the blind run deriving by hand and got
# structurally different. The client had already written it down.
#
# I had classified that sheet on the PRODUCTS run, as a source of products (46
# of 419 rows ship as products). Having answered "what is this sheet" once, I
# never asked it again for a different file type. That is the reusable failure.
#
# ============================================================================
# THE SHAPE, WHICH IS THE ACTUAL FORMAT LESSON
# ============================================================================
#
# A sideways option block is TWO sources, not one, and they answer different
# questions:
#
#     the CATALOGUE   what the options ARE       rows    -> options.csv
#     the MATRIX      who can HAVE which         columns -> option_groups.csv
#
# The blind mapping collapsed them and had to invent the half it was missing.
# `[option_catalogue]` + `matrix_columns` + `option_types` separates them, and
# with a catalogue present the axis partition stops being a judgement call:
# it is a column the client already filled in.
#
# **Before declaring a partition, look for the column that already carries it.**

client        = "tcs"
org_name      = "The CopperSmith"
kind          = "option_stack"
input_class   = 3
dialect       = "tcs"
line_terminator = "crlf"
primary_input = "lanterns"

null_tokens       = ["----", "---", "--", "-", "N/A", "n/a"]
on_code_collision = "report"

# ImageName is DELIBERATELY NOT EMITTED, and that is a decision, not an omission.
#
# The importer already defaults it to `{code}.jpg`, so emitting that value adds
# nothing. And it is wrong here: only 31 of the build's 341 options use the
# default. The rest are hand-mapped swatches (`ContempoFlush_ADS.jpg`,
# `BFH.jpg` for BFH1..BFH10) from a map that does not exist anywhere in the
# source folder. Emitting `{code}.jpg` would have been wrong on 322 of 328 rows.
#
# This is Legrand's 19 destroyed images, in a different file: a value the
# generator cannot derive must come from the last known-good file or a
# regeneration destroys it. Blind, I emitted it. That was the error.
#
# Add it back only as carry-forward, against a previous options.csv.
options_columns       = ["Code", "Name", "Description", "PriceAddend"]
option_groups_columns = ["Code", "Name", "Options"]

# The availability matrix: the same 72 columns, unioned BY NAME with repeats
# disambiguated positionally. Which axis each cell belongs to now comes from the
# catalogue, so this list no longer carries a partition at all.
