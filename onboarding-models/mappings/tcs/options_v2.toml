[product_key]
column = "SKU"

# ---------------------------------------------------------------------------
# THE CATALOGUE. 419 accessory SKUs; the option types are eight of its twelve
# categories. BULBS, PARTS, RLM and ACCESSORIES are NOT option types -- they are
# products, or in the case of PARTS not shipped at all -- and a code whose
# category is not claimed by an axis is counted and skipped, never guessed at.
#
# emit = "referenced": a catalogue row nobody can order is not an option. 333 of
# the 419 rows are referenced by the matrix. The build ships 341, of which 13
# appear in no source file at all (BRASS, COPPER, COY4/5/8, CY06/07/18/20,
# GNP7, PFA, COY12, COY13) -- added by hand from something outside the folder,
# and not derivable here. Five more (BS, BSW, FH, RBS, WG) are unsuffixed base
# codes present in the matrix and excluded by the build's own audit fix.
# ---------------------------------------------------------------------------

[option_catalogue]
input = "accessories"
code  = "Accessory SKU"
name  = "Accessory Name"
type  = "Accessory Category"
emit  = "referenced"
fields = { PriceAddend = "Accessory Dealer Net" }

# The client SHOUTS its categories; the build title-cases them. Declared as data
# rather than done with a .title() call, because "POST & PIER MOUNT" ->
# "Post & Pier Mount" is not what .title() produces and a silent mismatch here
# renames every option type on the iPad.
# ---------------------------------------------------------------------------
# PER-CODE TYPE OVERRIDE — the single largest correction in this file.
#
# The catalogue's type column is per CODE. The matrix's type is per COLUMN.
# When one code appears in columns of two different types, the catalogue cannot
# express it and the code lands in exactly one axis.
#
# `LR` is that code, and it was 68 of the 100 member sets this mapping got
# wrong — 22 of the 32 points of missing recall, from ONE row of the client's
# catalogue:
#
#   catalogue     LR | Ladder Rests | POST & PIER MOUNT      <- wrong
#   matrix        `Ladder Rests`      LR on 171 rows          <- a ceiling mount
#                 `Post Ladder Rest`  PLR on 156, LR on 3     <- 3 are typos
#   live build    LR -> Ceiling Mount
#
# `Ladder Rests` is a ceiling-mount accessory. The client filed it under
# POST & PIER MOUNT in its own catalogue and the build corrected it by hand.
# That correction is NOT derivable from the source, so it is DECLARED DATA with
# a reason rather than inferred — a mapping that silently re-filed a client's
# own categories would be the class-2 failure in a new costume.
#
# Because groups are per-product, one miscategorised code multiplies across
# every product that offers it. 171 of 379 products offer LR. That is why a
# single row moved a whole-file metric by 22 points, and it is the reason this
# file type needs a per-code escape at all.
#
# THE THREE `LR` VALUES IN `Post Ladder Rest` ARE A SOURCE TYPO and are NOT
# corrected here. They put LR on 3 products that should have PLR. Reproducing
# them is correct; telling the client is a separate action (FINDINGS_2b P7).
# ---------------------------------------------------------------------------

[option_type_overrides]
"LR" = "CEILING MOUNT"

[type_labels]
"GAS"                = "Gas"
"ELECTRIC"           = "Electric"
"FINISHES"           = "Finish"
"DECORATIVE OPTIONS" = "Decorative"
"WALL ACCESSORIES"   = "Wall Accessories"
"CEILING MOUNT"      = "Ceiling Mount"
"WALL MOUNT"         = "Wall Mount"
"POST & PIER MOUNT"  = "Post & Pier Mount"

[inputs.lanterns]
format   = "csv_multi_named"
encoding = "utf-8-sig"
files = [
  { path = "Source Data/Master Sheet E+G-Table 1.csv", header_row = 2, tag = { _sheet = "master" } },
  { path = "Source Data/Weiyan LED-Table 1.csv", header_row = 2, tag = { _sheet = "weiyan" } },
]

# Header on ROW 2. Row 1 is a banner whose THIRD cell reads
# "**DO NOT CHANGE COLUMN HEADERS!" -- an instruction to a human sitting inside
# the data. `csv_multi_named` is the reader that can be told which row that is.
[inputs.accessories]
format   = "csv_multi_named"
encoding = "utf-8-sig"
files = [
  { path = "Source Data/Accessories-Table 1.csv", header_row = 2 },
]


# ===========================================================================
# THE AXES -- one per catalogue type. No hand partition.
# ===========================================================================

[[axis]]
code         = "FIN"
name         = "Finish"
option_set   = 1
required     = "Y"
option_types = ["FINISHES"]
grouping     = "per_product"
group_code   = "FIN{n}"
group_name   = "Finish {n}"

[[axis]]
code         = "GAS"
name         = "Gas"
option_set   = 2
required     = "N"
option_types = ["GAS"]
grouping     = "per_product"
group_code   = "GAS{n}"
group_name   = "Gas {n}"

[[axis]]
code         = "ELE"
name         = "Electric"
option_set   = 3
required     = "N"
option_types = ["ELECTRIC"]
grouping     = "per_product"
group_code   = "ELE{n}"
group_name   = "Electric {n}"

[[axis]]
code         = "DEC"
name         = "Decorative"
option_set   = 4
required     = "N"
option_types = ["DECORATIVE OPTIONS"]
grouping     = "per_product"
group_code   = "DEC{n}"
group_name   = "Decorative {n}"

[[axis]]
code         = "WA"
name         = "Wall Accessories"
option_set   = 5
required     = "N"
option_types = ["WALL ACCESSORIES"]
grouping     = "per_product"
group_code   = "WA{n}"
group_name   = "Wall Accessories {n}"

[[axis]]
code         = "WM"
name         = "Wall Mount"
option_set   = 6
required     = "N"
option_types = ["WALL MOUNT"]
grouping     = "per_product"
group_code   = "WM{n}"
group_name   = "Wall Mount {n}"

[[axis]]
code         = "CM"
name         = "Ceiling Mount"
option_set   = 7
required     = "N"
option_types = ["CEILING MOUNT"]
grouping     = "per_product"
group_code   = "CM{n}"
group_name   = "Ceiling Mount {n}"

[[axis]]
code         = "PP"
name         = "Post & Pier Mount"
option_set   = 8
required     = "N"
option_types = ["POST & PIER MOUNT"]
grouping     = "per_product"
group_code   = "PP{n}"
group_name   = "Post & Pier Mount {n}"

