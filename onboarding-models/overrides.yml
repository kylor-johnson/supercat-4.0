# Onboarding framework manual overrides
#
# Small, version-controlled set of human-confirmed facts the live data can't
# express on its own. Edit here once; every future run reads it. No DB writes.
#
# Integration OWNERSHIP is NOT here — it is read authoritatively from the
# HubSpot deal line items at run time (see Phase_Anchors.md § Integration
# Workstream). This file records the *status* of an owned integration plus the
# by-design / domain facts below that have no system of record.

# Orgs confirmed to run single Net-Price-only pricing BY DESIGN.
# Listing a shortname here means: 1 price level is intentional, Phase 3's price
# requirement is satisfied, and SINGLE_PRICE_LEVEL_UNCONFIRMED must NOT fire.
# (See Flags_and_Signals.md § F and Phase_Anchors.md § Phase 3 Done-when.)
net_price_only_confirmed:
  []  # drf removed 2026-07-16 — DRF now has 11 price levels (confirmed HelpScout #14638 Jul 2)

# Integration STATUS for clients SuperCat owns the build on (a "Managed
# Integration" deal line item). Ownership comes from HubSpot; this just records
# where the build stands so INTEGRATION_OWNER_UNCLEAR stops firing once tracked.
#   <shortname>:
#     approach: API | FTP | PIM     # how the data moves
#     status:   scoping | building | live
#     note:     free text (who's driving, last activity, etc.)
# Leave empty until a managed-integration client needs tracking.
integration_status:
  libco:
    approach: API
    status: building
    note: Managed Integration (Business Central), Brent building
  # example — uncomment and edit when a managed integration is in flight:
  # acme:
  #   approach: API
  #   status: building
  #   note: ERP push live in staging; cutover targeted next sprint

# Manual client_domains[] overrides (Phase_Anchors.md § Resolving client_domains[]).
# Use ONLY when the live resolution order can't produce the right set — e.g. a
# legitimate second parent/DBA domain the order-email/admin-email sources miss.
# A shortname listed here uses this list verbatim and skips the resolution order.
#   <shortname>: ["domain1.com", "domain2.com"]
client_domains: {}
  # example:
  # pebl: ["peblfurniture.com", "skyard-outdoor.com"]   # confirm skyard is a real DBA before enabling

# Per-client project start date (ISO YYYY-MM-DD).
# Use when organizations.created_at ≠ real project kickoff — e.g. the account
# was provisioned months before the client actually started onboarding.
# When present, days_in_onboarding is computed from this date, not created_at.
#   <shortname>: YYYY-MM-DD
project_start_date: {}
  # example:
  # pebl: "2026-01-24"   # provisioned 2025-07-24 but project started 2026-01-24
