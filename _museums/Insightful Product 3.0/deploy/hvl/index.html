<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hudson Valley Lighting — Intelligence Report</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAFAF8; --surface: #FFFFFF; --border: #E8E5DE;
      --text: #2C2925; --text-secondary: #6B6660; --text-muted: #9B958C;
      --accent: #C47A4A; --accent-deep: #89523B; --accent-light: #F5EDE6;
      --danger: #C0524A;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gate {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 3rem 2.5rem;
      max-width: 420px;
      width: 90vw;
      text-align: center;
      box-shadow: 0 4px 24px rgba(44,41,37,.06);
    }
    .gate .brand {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }
    .gate h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }
    .gate .sub {
      font-size: 0.88rem;
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }
    .gate input {
      width: 100%;
      padding: 0.85rem 1rem;
      font-family: inherit;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      text-align: center;
      letter-spacing: 0.15em;
      transition: border-color .2s;
    }
    .gate input:focus { border-color: var(--accent); }
    .gate button {
      width: 100%;
      margin-top: 1rem;
      padding: 0.85rem;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background .2s;
    }
    .gate button:hover { background: var(--accent-deep); }
    .gate .error {
      margin-top: 1rem;
      font-size: 0.82rem;
      color: var(--danger);
      display: none;
    }
    .bar {
      width: 50px; height: 3px;
      background: var(--accent);
      border-radius: 2px;
      margin: 0 auto 1.5rem;
    }
    .footer {
      margin-top: 2rem;
      font-size: 0.72rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

    <h1>Hudson Valley Lighting</h1>
    <div class="sub">Enter your access code to view this report.</div>
    <div class="bar"></div>
    <input type="password" id="pw" placeholder="Access code" autofocus
           onkeydown="if(event.key==='Enter')unlock()">
    <button onclick="unlock()">View Report</button>
    <div class="error" id="err">Incorrect access code. Please try again.</div>
    <div class="footer">SuperCat Solutions &middot; Confidential</div>
  </div>

    var SALT = "PFKeaLzSVMyLtcAT4kdCFw==";
    var IV = "4uKyj10+Jm5IBbYV";

    async function deriveKey(password) {
      var enc = new TextEncoder();
      var keyMaterial = await crypto.subtle.importKey(
        "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: b64ToBytes(SALT), iterations: 100000, hash: "SHA-256" },
        keyMaterial, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
      );
    }

    function b64ToBytes(b64) {
      var bin = atob(b64);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }

    async function unlock() {
      var pw = document.getElementById("pw").value;
      if (!pw) return;
      try {
        var key = await deriveKey(pw);
        var decrypted = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: b64ToBytes(IV) },
          key, b64ToBytes(ENC)
        );
        var html = new TextDecoder().decode(decrypted);
        sessionStorage.setItem("ir_hvl", pw);
        document.open();
        document.write(html);
        document.close();
      } catch (e) {
        document.getElementById("err").style.display = "block";
        document.getElementById("pw").select();
      }
    }

    (async function() {
      var saved = sessionStorage.getItem("ir_hvl");
      if (saved) {
        document.getElementById("pw").value = saved;
        await unlock();
      }
    })();
